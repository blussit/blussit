<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The tab icon is the "B" mark cropped straight from blussit-logo.png
         (the official wordmark) — previously a generic car glyph unrelated
         to the brand. .ico first for broad browser support, PNG mark as a
         fallback, plus an iOS home-screen icon. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/blussit-mark.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- No maximum-scale for everyone: pinch-zoom is an accessibility
         feature (low vision) and Android Chrome honours maximum-scale=1 by
         blocking it. iOS Safari ignores it for pinch-zoom but uses it to
         stop the page auto-zooming into every focused form field under
         16px (the "page jumps" during booking) — so the script below adds
         it on iOS only, where it can't block zooming.
         interactive-widget=resizes-content: the on-screen keyboard shrinks
         the layout (and dvh) instead of covering bottom sheets and their
         submit buttons. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <script>
      (function () {
        try {
          var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
          var meta = document.querySelector('meta[name="viewport"]');
          if (ios && meta) meta.setAttribute("content", meta.getAttribute("content") + ", maximum-scale=1");
        } catch (e) {}
      })();
    </script>
    <meta name="theme-color" content="#FFFFFF" />
    <!-- The /thank-you ticket must never reach analytics: an old-style
         ?token= link is moved into this tab's storage and out of the
         address bar BEFORE Google Analytics or the Meta Pixel read the URL
         (they record page URLs). The page reads it back (src/lib/thankYou.ts). -->
    <script>
      (function () {
        try {
          if (location.pathname === "/thank-you" && /[?&]token=/.test(location.search)) {
            var params = new URLSearchParams(location.search);
            sessionStorage.setItem("blussit:thank-you", params.get("token") || "");
            params.delete("token");
            var rest = params.toString();
            history.replaceState(history.state, "", "/thank-you" + (rest ? "?" + rest : "") + location.hash);
          }
        } catch (e) {}
      })();
    </script>

    <!-- A bare pre-hydration fallback so the tab doesn't sit blank for the
         instant before React mounts — harmless to duplicate, since browsers
         just use whichever <title> comes last in the document. NO static
         description/canonical though: every route (including "/") sets its
         own through <PageSeo> (see src/components/shared/PageSeo.tsx),
         sourced from the single src/seo/pages.json list, and a static
         canonical here alongside a conflicting one from Helmet after
         hydration is exactly the "multiple canonical tags" situation
         Google says can make it ignore all of them — that one has to come
         from the same place for every route, with nothing to conflict. -->
    <title>Blussit</title>

    <!-- OG/Twitter stay static: link-preview scrapers (WhatsApp, iMessage,
         Facebook, ...) generally don't run JavaScript, so anything
         Helmet-only would never reach them. PageSeo adds matching
         og:title/description/url per route on top of these, for the
         crawlers that DO run JS — pure upside, no conflict risk like
         canonical has. -->
    <meta property="og:site_name" content="Blussit" />
    <meta property="og:title" content="Blussit — Premium Doorstep Car & Bike Wash in Indore" />
    <meta
      property="og:description"
      content="Book a premium car or bike wash at your doorstep in Indore. Verified captains, transparent pricing — no queues, no driving anywhere."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://blussit.com/" />
    <meta property="og:image" content="https://blussit.com/banner.webp" />
    <meta property="og:image:width" content="1567" />
    <meta property="og:image:height" content="1004" />
    <meta property="og:image:alt" content="Blussit — premium car wash at your doorstep" />
    <meta property="og:locale" content="en_IN" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Blussit — Premium Doorstep Car & Bike Wash in Indore" />
    <meta name="twitter:description" content="Book a premium car or bike wash at your doorstep in Indore." />
    <meta name="twitter:image" content="https://blussit.com/banner.webp" />


    <!-- Fonts load WITHOUT blocking the first paint: the page shows at once in
         the fallback font and swaps when they arrive (display=swap). A plain
         <link rel="stylesheet"> here made every visitor wait for two extra
         connections (fonts.googleapis.com + fonts.gstatic.com) before
         anything could be drawn. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;800&display=swap" rel="stylesheet" />
    </noscript>

    <!-- Structured data. Deliberately factual only: no ratings, awards or
         certifications we can't substantiate (and no review/rating markup —
         curated testimonials on our own business would be self-serving).
         The address is the office (same as the footer and BUSINESS in
         src/seo/content.ts — keep all three identical to the Google Business
         Profile); hours 07:00-19:00. No "geo": we'd rather Google place the
         pin from the address than from coordinates nobody verified. "AutoWash"
         is schema.org's specific type for car-wash businesses and is what
         makes this eligible for local/"near me" results, on top of plain
         Organization/WebSite. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": ["Organization", "LocalBusiness", "AutoWash"],
            "@id": "https://blussit.com/#organization",
            "name": "Blussit",
            "alternateName": ["Blussit Car Wash", "Blushit", "Blusit", "Bluss It", "Blush It", "Blasit", "Blashit"],
            "url": "https://blussit.com/",
            "logo": "https://blussit.com/blussit-logo.png",
            "image": "https://blussit.com/banner.webp",
            "telephone": "+91-8962288774",
            "email": "contact.blussit@gmail.com",
            "sameAs": ["https://www.instagram.com/blussitwash/", "https://www.facebook.com/people/Blussit/61593594339671/"],
            "priceRange": "₹₹",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "88 Shivampuri Colony, Bhawarkuwa",
              "addressLocality": "Indore",
              "addressRegion": "Madhya Pradesh",
              "postalCode": "452001",
              "addressCountry": "IN"
            },
            "hasMap": "https://www.google.com/maps/search/?api=1&query=88+Shivampuri+Colony%2C+Bhawarkuwa%2C+Indore+452001",
            "areaServed": { "@type": "City", "name": "Indore" },
            "openingHoursSpecification": {
              "@type": "OpeningHoursSpecification",
              "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
              "opens": "07:00",
              "closes": "19:00"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://blussit.com/#website",
            "url": "https://blussit.com/",
            "name": "Blussit",
            "publisher": { "@id": "https://blussit.com/#organization" },
            "inLanguage": "en-IN"
          },
          {
            "@type": "Service",
            "name": "Doorstep vehicle cleaning",
            "serviceType": "Car and bike cleaning at the customer's location",
            "provider": { "@id": "https://blussit.com/#organization" },
            "areaServed": { "@type": "City", "name": "Indore" }
          }
        ]
      }
    </script>

    <!-- Google Analytics (GA4) — the 190 KB tag loads AFTER the page has
         finished (and a couple of seconds later), so it never competes with
         the hero picture and the booking code for a phone's bandwidth. Events
         fired before it arrives are queued in dataLayer and sent then. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-HLQLRBBC24');
      window.addEventListener('load', function () {
        setTimeout(function () {
          var tag = document.createElement('script');
          tag.async = true;
          tag.src = 'https://www.googletagmanager.com/gtag/js?id=G-HLQLRBBC24';
          document.head.appendChild(tag);
        }, 2500);
      });
    </script>

    <!-- Meta Pixel — Meta's standard snippet, except fbevents.js is fetched
         once the page has loaded (like GA4 above) so it never delays the hero
         or the booking code. The fbq stub queues the PageView until then.
         Route changes in the SPA are tracked by the pixel itself (it listens
         to history pushState), so no per-route PageView call is needed.
         Live site only: test bookings on localhost / Vercel previews would
         otherwise reach Meta as real Purchases (src/lib/metaPixel.ts). -->
    <script>
      if (/(^|\.)blussit\.com$/.test(location.hostname))
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];f.addEventListener('load',function(){t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)})}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      if (window.fbq) {
        fbq('init', '1153209444066340');
        fbq('track', 'PageView');
      }
    </script>
  </head>
  <body>
    <noscript><img height="1" width="1" style="display:none" alt=""
      src="https://www.facebook.com/tr?id=1153209444066340&ev=PageView&noscript=1"
    /></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
